# ============================================================
#  Save this as .github/workflows/weekly-audit.yml
#
#  Runs every Monday 08:00 Brisbane time (22:00 UTC Sunday).
#  Three jobs:
#    1. audit   — the self-audit script: stale data, timezone
#                 drift, compliance invariants, front-end hygiene
#    2. links   — checks every external link still resolves
#    3. report  — opens (or updates) a single GitHub issue
#
#  Repo settings needed: Settings → Actions → General →
#  Workflow permissions → "Read and write permissions".
# ============================================================
name: Weekly audit

on:
  schedule:
    - cron: '0 22 * * 0'      # Sunday 22:00 UTC = Monday 08:00 Brisbane
  workflow_dispatch:           # lets you run it manually any time
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run self-audit
        id: run
        continue-on-error: true
        run: |
          node audit.mjs index.html > audit-report.md 2>&1 || true
          {
            echo 'report<<AUDIT_EOF'
            cat audit-report.md
            echo 'AUDIT_EOF'
          } >> "$GITHUB_OUTPUT"
          cat audit-report.md

      - name: Check the JavaScript still parses
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('index.html','utf8');
            const js=html.match(/<script>([\s\S]*?)<\/script>/g).pop()
                         .replace(/^<script>/,'').replace(/<\/script>$/,'');
            fs.writeFileSync('/tmp/app.js', js);
          "
          node --check /tmp/app.js
          echo "JS parses cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.md

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          # Booking/Google/Instagram search URLs are built at runtime and
          # rate-limit bots, so only check the real destinations.
          args: >-
            --no-progress
            --accept 200,203,206,999
            --exclude booking\.com
            --exclude google\.com
            --exclude instagram\.com
            --exclude eventbrite
            --max-concurrency 4
            index.html
          output: link-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.md

  report:
    needs: [audit, links]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ needs.audit.outputs.report }}

            ---
            _Generated by the weekly audit. Run \`node audit.mjs\` locally to reproduce._`;

            const title = 'Weekly audit';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit'
            });

            const existing = issues.find(i => i.title.startsWith(title));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['audit']
              });
            }
